<form id="lloyds-3ds-challenge" name="lloyds-3ds-challenge" action="{ACS_URL}" method="POST"
      enctype="application/x-www-form-urlencoded" style="display:none;">
    <input type="hidden" name="creq" value="{CREQ}">
    <input type="hidden" name="TermURL" value="{TERM_URL}">
</form>
<div id="loader-container"
     style="position: fixed;top: 0;left: 0;width: 100%;height: 100%;
            display: flex;align-items: center;justify-content: center;
            flex-direction: column;z-index: 9999;background:#fff;">
    <div class="loader"
         style="border: 4px solid #f3f3f3;border-top: 4px solid #007bff;
                border-radius: 50%;width: 50px;height: 50px;
                animation: spin 1s linear infinite;margin: 10px;">
    </div>
    <p class="loader-text" style="font-size:16px;color:#333;text-align:center;">
        {PROCESSING_MESSAGE}
    </p>
</div>
<style>
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>
<script>
    (function () {
        var form = document.getElementById('lloyds-3ds-challenge');
        if (form) {
            form.submit();
        }
    })();
</script>

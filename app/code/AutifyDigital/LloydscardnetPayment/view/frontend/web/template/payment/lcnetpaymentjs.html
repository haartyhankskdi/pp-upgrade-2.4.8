<div class="payment-method" data-bind="css: {'_active': (getCode() == isChecked())}">
    <div class="payment-method-title field choice lcnet">
        <input type="radio"
               name="payment[method]"
               class="radio"
               data-bind="attr: {'id': getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod, visible: isRadioButtonVisible()">
        <label data-bind="attr: {'for': getCode()}" class="label">
            <span data-bind="text: getTitle()"></span>
            <!-- ko if: window.checkoutConfig.payment.lcnetpaymentjs.payment_logo -->
                <img data-bind="attr: {src: window.checkoutConfig.payment.lcnetpaymentjs.payment_logo}" class="payment-icon" style="margin-right: 0; float: right; max-height: 40px;" alt="Lloyd's Cardnet"/>
            <!-- /ko -->
        </label>
    </div>
    <div class="payment-method-content">
        <!-- ko foreach: getRegion('messages') -->
        <!-- ko template: getTemplate() --><!-- /ko -->
        <!--/ko-->
        <div class="payment-method-billing-address">
            <!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>
        <!-- ko if: saveCards.length > 0 -->
        <select name="payment[token_id]" class="saved-card-dropdown" data-bind="options: renderSaveCardsDropdown(), optionsText: 'label', optionsValue: 'value', value: selectedCard"></select>
		<!-- /ko -->

        <div class="paymentjs-form" data-bind="visible: selectedCard() === ''">
            <form id="form" >
                <fieldset class="fieldset">
                    <div class="fields">
                        <div class="field">
                            <label for="cc-name" class="control-label" data-bind="i18n: 'Card Holder Name'"></label>
                            <div class="form-controls payment-fields disabled" id="cc-name" data-cc-name></div>
                        </div>
                        <div class="field">
                            <label for="cc-card" class="control-label" data-bind="i18n: 'Card Number'"></label>
                            <div class="form-controls payment-fields disabled empty" id="cc-card" data-cc-card></div>
                        </div>
                        <div class="fields-row">
                            <div class="field">
                                <label for="cc-exp" class="control-label" data-bind="i18n: 'Exp Date'"></label>
                                <div class="form-controls payment-fields disabled empty" id="cc-exp" data-cc-exp></div>
                            </div>
                            <div class="field">
                                <label for="cc-cvv" class="control-label" data-bind="i18n: 'CVV'"></label>
                                <div class="form-controls payment-fields disabled empty" id="cc-cvv" data-cc-cvv></div>
                            </div>
                        </div>
                    </div>
                    <!-- New checkbox for saving the card -->
                    <div class="save-card-checkbox field" data-bind="visible: isCustomerLoggedIn() && !selectedCard()">
                        <input type="checkbox" id="save-card" data-bind="checked: saveCard">
                        <label for="save-card" data-bind="i18n: 'Save this card for future use'"></label>
                    </div>
                </fieldset>
            </form>
        </div>
        <div class="checkout-agreements-block">
            <!-- ko foreach: $parent.getRegion('before-place-order') -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>
        <div class="actions-toolbar">
            <div class="primary">
                <button class="action primary checkout"
                        type="submit"
                        data-bind="
                        click: placeOrder,
                        attr: {title: $t('Place Order')},
                        css: {disabled: !isPlaceOrderActionAllowed()},
                        enable: (getCode() == isChecked())
                        "
                        disabled>
                    <span data-bind="i18n: 'Place Order'"></span>
                </button>
            </div>
        </div>
    </div>
</div>
